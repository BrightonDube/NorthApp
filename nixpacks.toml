[phases.setup]
nixPkgs = ["python312", "stdenv.cc.cc.lib"]

[phases.build]
cmds = [
  "cd backend && python -m venv .venv && . .venv/bin/activate && python -m pip install --upgrade pip && pip install -r requirements.txt"
]

[start]
cmd = "cd backend && . .venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
