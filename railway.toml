[build]
builder = "NIXPACKS"
buildCommand = "cd backend && python -m venv .venv && . .venv/bin/activate && python -m pip install --upgrade pip && pip install -r requirements.txt"

[deploy]
startCommand = "cd backend && . .venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
