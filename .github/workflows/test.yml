name: Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'north-mobile/**'
      - '!north-mobile/.github/**'
      - '!north-mobile/**.md'
  push:
    branches:
      - main
    paths:
      - 'north-mobile/**'
      - '!north-mobile/.github/**'
      - '!north-mobile/**.md'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./north-mobile
    
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: north-mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --coverage --maxWorkers=2 --testPathIgnorePatterns="property|integration"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./north-mobile/coverage/lcov.info
          flags: unittests
          name: north-mobile-coverage
          fail_ci_if_error: false
