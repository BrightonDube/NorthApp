name: Release to Store

on:
  push:
    branches:
      - main
    paths:
      - 'north-mobile/**'
      - '!north-mobile/.github/**'
      - '!north-mobile/**.md'
      - '!north-mobile/coverage/**'
      - '!north-mobile/__tests__/**'

jobs:
  # First, run tests to ensure quality
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./north-mobile
    
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: north-mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --coverage --maxWorkers=2 --testPathIgnorePatterns="property|integration"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}

  # Build the app for Android
  build:
    name: Build Android App
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./north-mobile
    
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: north-mobile/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build Android app
        run: eas build --platform android --profile production --non-interactive --wait
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}

  # Submit to Google Play Store
  submit:
    name: Submit to Play Store
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./north-mobile
    
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: north-mobile/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Create service account key file
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > play-store-key.json

      - name: 🚀 Submit to Play Store
        run: eas submit --platform android --latest --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}

      - name: 🧹 Cleanup
        if: always()
        run: rm -f play-store-key.json

      - name: 📢 Notify Success
        if: success()
        run: echo "✅ App successfully submitted to Play Store internal track!"

      - name: 📢 Notify Failure
        if: failure()
        run: echo "❌ Submission failed. Check logs for details."
